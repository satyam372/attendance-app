# Checks every pull request into dev or main (CLAUDE.md: "CI must pass").
# Frontend: install, unit tests, production build (the same build Vercel runs).
# Backend: ruff lint and pytest. pytest must never reach Supabase, so no DATABASE_URL is set here.

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# A new push to the same PR cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests (business rules)
        run: npm test
      - name: Production build
        run: npm run build
        env:
          API_URL: /api
          USE_MOCK_API: "false"

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        # Exit code 5 means "no tests collected" (the test files are still empty); anything else fails
        run: uv run pytest || [ $? -eq 5 ]
