<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="SpeedIn: attendance, leave and work from home for Speed Innovations." />
    <title>SpeedIn · Attendance</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      // Must stay in sync with THEME_STORAGE_KEY in src/theme/ThemeContext.jsx.
      (function () {
        var pref = "system";
        try { pref = localStorage.getItem("speedin-theme") || "system"; } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
        // "Reduce transparency" (Profile → Appearance): opaque surfaces instead of glass.
        // Must stay in sync with GLASS_STORAGE_KEY in src/theme/ThemeContext.jsx.
        try { if (localStorage.getItem("speedin-reduce-transparency") === "1") document.documentElement.classList.add("reduce-glass"); } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
